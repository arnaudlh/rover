[package]
name = "rover"
version = "1.0.0"
edition = "2021"
authors = ["Arnaud Lheureux <arnaud.lheureux@microsoft.com>"]
description = "Terraform wrapper for Azure state management and CI/CD integration"
license = "MIT"
repository = "https://github.com/arnaudlh/rover"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
shellexpand = "3.1"
glob = "0.3"
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
